services:
  - type: web
    name: quiz-battle-3d
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Required for permanent accounts: Render's disk is wiped on every restart,
      # so without a database all users are lost. Set the value in the Render
      # dashboard (see .env.example for how to get a free MongoDB Atlas URI).
      - key: MONGODB_URI
        sync: false
