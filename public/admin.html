<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Question Bank Manager | Quiz Battle 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=68.0">
  <style>
    body {
      background: #080c16;
      color: #e2e8f0;
      font-family: 'Be Vietnam Pro', sans-serif;
      margin: 0;
      padding: 20px;
      overflow-y: auto;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00b4d8;
      border-radius: 12px;
      padding: 16px 24px;
      box-shadow: 0 4px 24px rgba(0, 180, 216, 0.2);
    }
    .admin-title {
      font-size: 20px;
      font-weight: 800;
      color: #00b4d8;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      text-decoration: none;
      color: #ff6b35;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid #ff6b35;
      padding: 10px 18px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: rgba(255, 107, 53, 0.15);
      transform: translateY(-1px);
    }
    .grid-layout {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }
    .admin-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .card-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }
    .bank-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat-badge {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .stat-badge:hover, .stat-badge.active {
      border-color: #00b4d8;
      background: rgba(0, 180, 216, 0.1);
    }
    .stat-badge .stat-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    .stat-badge .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
    }
    .form-select, .form-input {
      background: #0f172a;
      border: 1.5px solid #334155;
      color: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
    }
    .form-select:focus, .form-input:focus {
      outline: none;
      border-color: #00b4d8;
    }
    .btn-submit {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn-submit:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn-danger-action {
      background: rgba(239, 68, 68, 0.2);
      border: 1.5px solid #ef4444;
      color: #ef4444;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-danger-action:hover {
      background: #ef4444;
      color: #fff;
    }
    .status-toast {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 11px;
      display: none;
      line-height: 1.4;
    }
    .status-toast.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
    }
    .status-toast.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    /* Explorer List */
    .explorer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .search-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      flex: 1;
      max-width: 240px;
    }
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .q-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }
    .q-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .q-num {
      color: #00b4d8;
      font-size: 11px;
    }
    .q-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 11px;
    }
    .q-opt {
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
    }
    .q-opt.correct {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
      font-weight: 700;
    }
    /* Dev Buttons */
    .dev-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-dev {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-dev:hover {
      background: #334155;
      color: #fff;
      transform: translateY(-1px);
    }
    .btn-dev-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      grid-column: span 2;
      font-size: 12px;
      font-weight: 800;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <div class="admin-title">
        <span style="font-size:24px;">📚</span>
        <div>
          <div>NGÂN HÀNG CÂU HỎI & QUẢN TRỊ VIÊN</div>
          <div style="font-size:11px; color:#64748b; font-weight:normal;">Chuẩn hóa dữ liệu theo <code>data/question/*.json</code> & Chơi thử trận đấu</div>
        </div>
      </div>
      <a href="/" class="back-btn">⬅️ Quay lại trò chơi</a>
    </header>

    <div class="grid-layout">
      <!-- Left Column: Upload & Quick Match -->
      <div style="display:flex; flex-direction:column; gap:20px;">
        <!-- Card 1: Question Bank Upload -->
        <div class="admin-card" style="border-color:#10b981;">
          <div class="card-title" style="color:#10b981;">
            <span>📥</span> Nạp &amp; Quản Lý Câu Hỏi
          </div>

          <!-- Stats Badges -->
          <div class="bank-stats-grid">
            <div class="stat-badge active" id="badge-thunder" data-el="thunder">
              <span class="stat-label">⚡ Hệ Sét</span>
              <span class="stat-val" id="stat-thunder">0 câu</span>
            </div>
            <div class="stat-badge" id="badge-fire" data-el="fire">
              <span class="stat-label">🔥 Hệ Lửa</span>
              <span class="stat-val" id="stat-fire">0 câu</span>
            </div>
            <div class="stat-badge" id="badge-frost" data-el="frost">
              <span class="stat-label">❄️ Hệ Băng</span>
              <span class="stat-val" id="stat-frost">0 câu</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Chọn Hệ Nạp:</label>
            <select id="q-upload-element" class="form-select">
              <option value="thunder">⚡ Hệ Sét (data/question/thunder.json)</option>
              <option value="fire">🔥 Hệ Lửa (data/question/Fire.json)</option>
              <option value="frost">❄️ Hệ Băng (data/question/Frost.json)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Chế Độ Nạp:</label>
            <select id="q-upload-mode" class="form-select">
              <option value="replace">Ghi đè hoàn toàn (Replace)</option>
              <option value="append">Nối tiếp thêm (Append)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">File Câu Hỏi (.docx, .xlsx, .json):</label>
            <input type="file" id="q-upload-file" class="form-input" accept=".docx,.xlsx,.json">
          </div>

          <div style="display:flex; gap:10px;">
            <button id="btn-upload-questions" class="btn-submit" style="flex:2;">
              <span>📤</span> Nạp Vào Ngân Hàng
            </button>
            <button id="btn-clear-questions" class="btn-danger-action" style="flex:1;">
              <span>🗑️</span> Xóa Hệ Này
            </button>
          </div>
          <button id="btn-upload-permanent" class="btn-submit" style="background:linear-gradient(135deg, #0284c7, #0369a1); width:100%; margin-top:2px;">
            <span>🔒</span> Khóa Vĩnh Viễn Thành Mặc Định (data/question/*.json)
          </button>
          <div id="toast-questions" class="status-toast"></div>
        </div>

        <!-- Card 2: Quick Launch & Dev Test -->
        <div class="admin-card" style="border-color:#f59e0b;">
          <div class="card-title" style="color:#f59e0b;">
            <span>🚀</span> Chơi Thử Nhanh (Dev Match Test)
          </div>

          <div class="form-group">
            <label class="form-label">Trang Phục Nhân Vật (Player Outfit):</label>
            <select id="dev-player-outfit" class="form-select">
              <option value="default">👤 Mặc Định (Normal 1-Hit)</option>
              <option value="thunder">⚡ Set Lôi (Thunder 2-Hit)</option>
              <option value="fire">🔥 Set Hỏa (Fire 2-Hit)</option>
              <option value="frost">❄️ Set Băng (Frost 2-Hit)</option>
            </select>
          </div>

          <div class="dev-grid">
            <button id="btn-dev-test-match" class="btn-dev btn-dev-primary">
              <span>🧪</span> Nạp 5 Câu Test &amp; Vào Trận Ngay
            </button>
            <button id="btn-launch-thunder" class="btn-dev">
              <span>⚡</span> Đấu Boss Sét
            </button>
            <button id="btn-launch-fire" class="btn-dev">
              <span>🔥</span> Đấu Boss Lửa
            </button>
            <button id="btn-launch-frost" class="btn-dev">
              <span>❄️</span> Đấu Boss Băng
            </button>
            <button id="btn-launch-lobby" class="btn-dev">
              <span>🏠</span> Về Sảnh Chính
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column: Interactive Question Bank Explorer -->
      <div class="admin-card" style="border-color:#00b4d8;">
        <div class="explorer-header">
          <div class="card-title" style="color:#00b4d8; border:none; padding:0;">
            <span>📖</span> Danh Sách Câu Hỏi (<span id="explorer-elem-title">HỆ SÉT</span>: <span id="explorer-count">0</span> câu)
          </div>
          <input type="text" id="explorer-search" class="search-input" placeholder="🔍 Tìm kiếm câu hỏi...">
        </div>

        <div id="explorer-list" class="question-list">
          <div style="text-align:center; color:#64748b; padding:40px;">Đang tải danh sách câu hỏi...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js?v=68.0"></script>
</body>
</html>
